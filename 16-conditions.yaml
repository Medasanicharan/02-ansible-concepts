- name: playbook control using ansible gathering facts
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install nginx if redhat
    ansible.builtin.dnf:
      name: nginx
      state: present
    when: ansible_facts.os_family == "RedHat"

  - name: install nginx if debian
    ansible.builtin.apt:
      name: nginx
      state: present
    when: ansible_os_family == "Debian"

  - name: install nginx in redhat
    dnf:
      name: nginx
      state: present
    when: ansible_facts.os_family == "RedHat"

  - name: install nginx ii debian
    apt:
      name: nginx
      state: present
    when: ansible_os_family == "Debian"