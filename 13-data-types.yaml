- name: ansible datatypes
  hosts: local
  connection: local
  vars:
    DURATION: 120 # This is number
    COURSE: "DevSecOps with AWS" # String
    IS_LIVE: true # boolean
    TOOLS: # List []
    - Linux
    - shell
    - Ansible
    CONCEPTS: # map or dictionary or object. referred like {}
      CI: Jenkins
      SCRIPTING: "Shell, Ansible, Terraform, Python"
  tasks:
  - name: print course information
    ansible.builtin.debug:
      msg: | 
        Course is: "{{ COURSE }} : {{ COURSE | type_debug }}"
        Duration: "{{ DURATION }} : {{ DURATION | type_debug }}"
        is live?: "{{ IS_LIVE }} : {{ IS_LIVE | type_debug }}"
        Tools are: "{{ TOOLS }} : {{ TOOLS | type_debug }}"
        Concepts are: "{{ CONCEPTS }} : {{ CONCEPTS | type_debug }}"
      # msg: "Course is: {{ COURSE }}, Duration: {{ DURATION }} : {{ DURATION }}, is live?:  : {{ IS_LIVE }}, Tools are: {{ TOOLS }} : {{ TOOLS }}, Concepts are: {{ CONCEPTS }}"