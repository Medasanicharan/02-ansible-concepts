- name: functions/filters
  hosts: local
  connection: local
  vars:
    persons: "Ramesh,Suresh,Raheem,Joseph" # string
  tasks:
  - name: check undefined variable
    ansible.builtin.debug:
      msg: "Hello, {{ person | default('Ramesh') }}"

  - name: print names
    ansible.builtin.debug:
      msg: "Hello {{ persons | split(',') }}"

  - name: convert map into list
    vars:
      course:
        name: ansible
        duration: 10HR
        trainer: sivakumar
    ansible.builtin.debug:
      msg: "Course Info: {{ course | dict2items  }}"

  - name: convert list into map
    vars:
      course:
      - {'key': 'name', 'value': 'ansible'}
      - {'key': 'duration', 'value': '10HR'}
      - {'key': 'trainer', 'value': 'charan'}
    ansible.builtin.debug:
      msg: "Course Info: {{ course | items2dict  }}"

  - name: convert to uppercase
    vars:
      name: "ChArAn MeDaSaNi"
    ansible.builtin.debug:
      msg: "Hello {{ name | upper }}"

  - name: convert to lowercase
    vars:
      name: "ChArAn MeDaSaNi"
    ansible.builtin.debug:
      msg: "Hello {{ name | lower }}"

  - name: Install netaddr using pip3.9
    ansible.builtin.pip:
      name: netaddr
      executable: pip3.9

  - name: check IP address is valid or not
    vars:
      ip: "54.157.61.118"
    ansible.builtin.debug:
      msg: "{{ ip | ansible.utils.ipaddr }}"

  # - name: check IP address is valid or not
  #   vars:
  #     ip: "54.209.52.82"
  #   ansible.builtin.debug:
  #     msg: "{{ ip | ansible.utils.ipaddr }}"

  - name: read students yaml
    ansible.builtin.set_fact: # setting the variable
      student_yaml: "{{ lookup('file', 'students.yaml') | from_yaml}}"

  - name: convert YAML to JSON
    ansible.builtin.debug:
      msg: "{{ student_yaml | to_nice_json }}"