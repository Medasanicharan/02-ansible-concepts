- name: Play level variables
  hosts: local
  connection: local
  vars:
    ACRES: 10acres # equal to ACRES: 10acres in shell, shell we refer $VAR or ${VAR}
    SELLER: Ram
    PURCHASE_DAY: Monday
  tasks:
    - name: print land purchase information
      ansible.builtin.debug:
      #vars refernce should be surrounded by ""
        msg: "I purchased {{ ACRES }} acres of land from {{ SELLER }} on {{ PURCHASE_DAY }}."

    - name: print land purchase information again
      vars: # this will aplly locally
        ACRES: 20acres # equal to ACRES: 10acres in shell, shell we refer $VAR or ${VAR}
        SELLER: charan
        PURCHASE_DAY: Saturday
      ansible.builtin.debug:
      #vars refernce should be surrounded by ""
        msg: "I purchased {{ ACRES }} acres of land from {{ SELLER }} on {{ PURCHASE_DAY }}."


