- name: install packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - net-tools
    - tree
  tasks:
  - name: install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: installed
    loop: "{{ packages }}" #list of string
  
